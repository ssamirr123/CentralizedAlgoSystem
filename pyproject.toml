[project]
name = "centralizedalgosystem"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
	"boto3>=1.34.0",
	"fastapi>=0.115.0",
	"httpx>=0.27.0",
	"pandas>=2.2.2",
	"psycopg2-binary>=2.9.0",
	"pydantic>=2.8.0",
	"sqlalchemy>=2.0.32",
	"uvicorn>=0.30.0",
	"requests>=2.32.0",
	"alembic>=1.13,<2.0",
	"bcrypt>=4.1.0",
	"PyJWT>=2.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
	"ignore::DeprecationWarning:starlette.*",
]
