# Local development stack: FastAPI backend + PostgreSQL.
#
#   cp .env.example .env      # then edit .env
#   docker compose up --build
#
# The backend waits for Postgres to be healthy, runs `alembic upgrade head`,
# then serves on http://localhost:8000 (/docs, /api/health, /api/algos).
#
# docker compose automatically reads .env in this directory for the
# ${VAR} substitutions below. No secret is stored in this file or the
# Dockerfile -- only non-sensitive defaults for a throwaway local stack.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-algo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-algo}
      POSTGRES_DB: ${POSTGRES_DB:-centralized_algo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-algo} -d ${POSTGRES_DB:-centralized_algo}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Not published to the host by default. Uncomment to inspect with psql:
    # ports:
    #   - "5432:5432"

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # PostgreSQL is the database for the Docker stack -- never SQLite.
      DATABASE_URL: ${DATABASE_URL:-postgresql://algo:algo@postgres:5432/centralized_algo}
      # Fails closed if unset in the app; a local-only default keeps
      # `docker compose up` frictionless. Override in .env for anything real.
      CONTROL_API_KEY: ${CONTROL_API_KEY:-dev-control-key}
      TRADING_MODE: ${TRADING_MODE:-paper}
      APP_ENV: ${APP_ENV:-docker}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DISABLE_BACKGROUND_WATCHER: ${DISABLE_BACKGROUND_WATCHER:-}
      # Stage 18 auth -- values come from .env in this directory. Empty
      # defaults keep a throwaway local stack frictionless; deps.py fails
      # closed on a missing AUTH_SECRET_KEY only when APP_ENV != development.
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_ACCESS_TTL_MINUTES: ${AUTH_ACCESS_TTL_MINUTES:-}
      AUTH_REFRESH_TTL_DAYS: ${AUTH_REFRESH_TTL_DAYS:-}
      AUTH_LOGIN_MAX_ATTEMPTS: ${AUTH_LOGIN_MAX_ATTEMPTS:-}
      AUTH_LOGIN_WINDOW_SECONDS: ${AUTH_LOGIN_WINDOW_SECONDS:-}
      AUTH_BOOTSTRAP_ADMIN_USERNAME: ${AUTH_BOOTSTRAP_ADMIN_USERNAME:-}
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:-}
      # Realtime (Stage 19). Endpoint mounts by default; these only tune it.
      REALTIME_ENABLED: ${REALTIME_ENABLED:-true}
      REALTIME_PING_INTERVAL_SECONDS: ${REALTIME_PING_INTERVAL_SECONDS:-}
      REALTIME_CLIENT_TIMEOUT_SECONDS: ${REALTIME_CLIENT_TIMEOUT_SECONDS:-}
      # Stage 19 market-data engine (ICICI Breeze). Opt-in via MARKET_DATA_ENABLED.
      # Breeze credentials come from .env / Secrets Manager -- never committed.
      MARKET_DATA_ENABLED: ${MARKET_DATA_ENABLED:-}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-}
      MARKET_DATA_TIMEZONE: ${MARKET_DATA_TIMEZONE:-Asia/Kolkata}
      MARKET_DATA_START_TIME: ${MARKET_DATA_START_TIME:-09:10}
      MARKET_DATA_STOP_TIME: ${MARKET_DATA_STOP_TIME:-15:45}
      MARKET_DATA_HOLIDAYS: ${MARKET_DATA_HOLIDAYS:-}
      NIFTY_OPTION_STRIKE_RANGE: ${NIFTY_OPTION_STRIKE_RANGE:-10}
      MARKET_DATA_STALE_SECONDS: ${MARKET_DATA_STALE_SECONDS:-10}
      MARKET_WS_UPDATE_INTERVAL_MS: ${MARKET_WS_UPDATE_INTERVAL_MS:-1000}
      MARKET_DATA_RETENTION_DAYS: ${MARKET_DATA_RETENTION_DAYS:-365}
      OPTION_DATA_RETENTION_DAYS: ${OPTION_DATA_RETENTION_DAYS:-180}
      BREEZE_ENABLED: ${BREEZE_ENABLED:-}
      BREEZE_API_KEY: ${BREEZE_API_KEY:-}
      BREEZE_SECRET_KEY: ${BREEZE_SECRET_KEY:-}
      BREEZE_SESSION_TOKEN: ${BREEZE_SESSION_TOKEN:-}
      BREEZE_SECRET_ID: ${BREEZE_SECRET_ID:-}
      OPTIONS_CHAIN_STRIKE_WINDOW: ${OPTIONS_CHAIN_STRIKE_WINDOW:-5}
      OPTIONS_RISK_FREE_RATE: ${OPTIONS_RISK_FREE_RATE:-0.065}
      OPTIONS_SNAPSHOT_CACHE_SECONDS: ${OPTIONS_SNAPSHOT_CACHE_SECONDS:-5}
      OPTIONS_INTELLIGENCE_ENABLED: ${OPTIONS_INTELLIGENCE_ENABLED:-}
      SENSEX_OPTION_STRIKE_RANGE: ${SENSEX_OPTION_STRIKE_RANGE:-10}
      MARKET_DATA_MAX_BACKFILL_DAYS: ${MARKET_DATA_MAX_BACKFILL_DAYS:-30}
      MARKET_DATA_MAX_PROVIDER_CALLS: ${MARKET_DATA_MAX_PROVIDER_CALLS:-5}
      # AI Research platform (Phases 5-10). Opt-in via AI_RESEARCH_ENABLED;
      # AI_WORKLOADS_ENABLED is the separate incident kill switch (Section 5
      # of Phase 11 -- distinct from TRADING_MODE). Provider API keys
      # (OPENAI_API_KEY / GROQ_API_KEY / ANTHROPIC_API_KEY / ...) are read
      # lazily by TradingAgents itself, not by this application's config,
      # but must still be present in the environment for whichever
      # AI_RESEARCH_LLM_PROVIDER is selected.
      AI_RESEARCH_ENABLED: ${AI_RESEARCH_ENABLED:-}
      AI_WORKLOADS_ENABLED: ${AI_WORKLOADS_ENABLED:-}
      AI_BACKTEST_ENABLED: ${AI_BACKTEST_ENABLED:-}
      AI_OPTIONS_RESEARCH_ENABLED: ${AI_OPTIONS_RESEARCH_ENABLED:-}
      AI_RESEARCH_LLM_PROVIDER: ${AI_RESEARCH_LLM_PROVIDER:-openai}
      AI_RESEARCH_MAX_CONCURRENT: ${AI_RESEARCH_MAX_CONCURRENT:-1}
      AI_RESEARCH_TIMEOUT_SECONDS: ${AI_RESEARCH_TIMEOUT_SECONDS:-300}
      AI_RESEARCH_DATA_DIR: ${AI_RESEARCH_DATA_DIR:-}
      AI_BACKTEST_MAX_SYMBOLS: ${AI_BACKTEST_MAX_SYMBOLS:-3}
      AI_BACKTEST_MAX_DATES: ${AI_BACKTEST_MAX_DATES:-12}
      AI_BACKTEST_MAX_RUNS: ${AI_BACKTEST_MAX_RUNS:-20}
      AI_BACKTEST_MAX_CONCURRENT: ${AI_BACKTEST_MAX_CONCURRENT:-1}
      AI_BACKTEST_HOLDING_DAYS: ${AI_BACKTEST_HOLDING_DAYS:-5}
      AI_OPTIONS_MAX_CONCURRENT: ${AI_OPTIONS_MAX_CONCURRENT:-1}
      AI_OPTIONS_TIMEOUT_SECONDS: ${AI_OPTIONS_TIMEOUT_SECONDS:-420}
      AI_OPTIONS_MAX_DEBATE_ROUNDS: ${AI_OPTIONS_MAX_DEBATE_ROUNDS:-3}
      AI_OPTIONS_MAX_CANDIDATES: ${AI_OPTIONS_MAX_CANDIDATES:-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Dashboard -> Lambda control hop (Stage 15 / Stage 20 P0). Needs the
      # backend instance role to also allow lambda:InvokeFunction.
      LAMBDA_FUNCTION_NAME: ${LAMBDA_FUNCTION_NAME:-}
      AWS_REGION: ${AWS_REGION:-}
      # Optional integrations -- set in .env when needed:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  pgdata:
