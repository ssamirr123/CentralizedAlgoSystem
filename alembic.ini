# Alembic configuration for CentralizedAlgoSystem.
#
# The database URL is NOT set here. alembic/env.py reads it from
# trading.database.connection.DATABASE_URL, which resolves to the
# DATABASE_URL environment variable (PostgreSQL in production) and falls
# back to a local SQLite file only when that is unset (isolated tests).
# This keeps one single source of truth for the connection string.

[alembic]
script_location = alembic
prepend_sys_path = .
# Timestamped, sortable revision filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
version_path_separator = os

# sqlalchemy.url is intentionally blank -- env.py injects it.
sqlalchemy.url =


[post_write_hooks]
# none


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
