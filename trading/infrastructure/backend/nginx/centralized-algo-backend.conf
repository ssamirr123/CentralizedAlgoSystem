# /etc/nginx/sites-available/centralized-algo-backend
#   sudo ln -s ../sites-available/centralized-algo-backend /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Internet -> Nginx (80/443) -> 127.0.0.1:8000 (uvicorn / FastAPI).
# TLS: run `sudo certbot --nginx -d <your-domain>` AFTER this file is in
# place and DNS points at the instance -- certbot rewrites the 443 block
# and the cert paths for you. Until you have a domain you can serve plain
# HTTP on 80 (drop the 443 server block and the redirect), but do add TLS
# before anything real talks to it.

upstream centralized_algo_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

# ---- HTTP: redirect everything to HTTPS (ACME challenge passes through) ----
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ---- HTTPS ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;   # replace with your domain once you have one

    # certbot fills these in; placeholders for a manual/self-signed start:
    ssl_certificate     /etc/ssl/centralized-algo/fullchain.pem;
    ssl_certificate_key /etc/ssl/centralized-algo/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 2m;

    # WebSocket-ready (for a future /ws/* endpoint) + normal proxying
    location / {
        proxy_pass http://centralized_algo_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout  75s;
        proxy_send_timeout  75s;
    }

    # health probe: cheap, unauthenticated, no access log noise
    location = /api/health {
        proxy_pass http://centralized_algo_backend;
        proxy_set_header Host $host;
        access_log off;
    }
}

# put this in /etc/nginx/conf.d/upgrade_map.conf (http{} scope), or keep here:
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
